name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS because the test suite exercises the real `brew` CLI wherever it
    # can. The suite degrades to a no-op when Homebrew is absent, so it still
    # passes elsewhere — but running it here is the point.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: No unreplaced placeholders
        # A v0.1.0 shipped pointing its updater at github.com/OWNER/own-brew,
        # so it could never find an update. Cheap to check, expensive to miss.
        run: |
          # This workflow names the placeholder in its own comment, so it is
          # not among the files checked.
          if grep -rn 'OWNER/own-brew' \
               src-tauri/tauri.conf.json README.md .github/workflows/release.yml; then
            echo "::error::placeholder OWNER found — replace with the real repository"
            exit 1
          fi

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build frontend
        run: pnpm build

      - name: Clippy
        working-directory: src-tauri
        # The project keeps clippy at zero warnings, so treat any as failure.
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Tests
        working-directory: src-tauri
        # Includes the live-Homebrew integration tests: the runner has brew
        # preinstalled, so they exercise the real CLI rather than skipping.
        run: cargo test --all-targets